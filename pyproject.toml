[project]
name = "ues"
version = "0.1.0"
description = "An AI-driven testing tool for AI personal assistants, simulating multiple input modalities via a RESTful API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "James Boggs", email = "jmsboggs@gmail.com"}
]
maintainers = [
    {name = "James Boggs", email = "jmsboggs@gmail.com"}
]
keywords = [
    "ai",
    "testing",
    "simulation",
    "personal-assistant",
    "api",
    "fastapi",
    "chatbot",
    "agent",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.121.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.38.0",
]

[project.urls]
Homepage = "https://github.com/JBoggsy/ues"
Documentation = "https://github.com/JBoggsy/ues#readme"
Repository = "https://github.com/JBoggsy/ues.git"
Issues = "https://github.com/JBoggsy/ues/issues"
Changelog = "https://github.com/JBoggsy/ues/blob/main/CHANGELOG.md"

[project.scripts]
ues = "ues.cli:main"
ues-server = "ues.cli:run_server"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx-ws>=0.7.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "websockets>=14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ues"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
